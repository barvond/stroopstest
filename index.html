<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test webu</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f4f4f7;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .box {
      background: #fff;
      padding: 40px 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 400px;
      margin: 16px;
    }
    h1 { margin-top: 0; }
    button {
      font-size: 16px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #2f6fed;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Funguje to! 🎉</h1>
    <p>Tohle je testovací stránka na GitHub Pages.</p>
    <button onclick="this.textContent = 'Kliknuto ' + (++window.n || (window.n = 1)) + '×'">Klikni</button>
  </div>
</body>
</html>
